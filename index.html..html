<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mata y Vení</title>
<style>
:root{--bg:#eef1f4;--fg:#1a2028;--pn:#fff;--ln:#c9d1da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--fg:#e6ebf0;--pn:#1b232c;--ln:#33404d}}
:root[data-theme="dark"]{--bg:#12171d;--fg:#e6ebf0;--pn:#1b232c;--ln:#33404d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:auto;padding:10px}
h1{margin:4px 0 8px;font-size:22px;display:flex;justify-content:space-between;align-items:center}
button{font:inherit;padding:9px 16px;border:0;border-radius:9px;background:#c62828;color:#fff;cursor:pointer}
#rs{background:none;color:inherit;border:1px solid var(--ln);padding:4px 10px;font-size:12px}
#board{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:8px}
.pl h3{margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.pl h3 b{font-size:24px}
.pl i,.sl i,#rv i{font-size:11px;opacity:.65;font-style:normal}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:4px}
.slot{width:100%;aspect-ratio:1;border:1px dashed var(--ln);border-radius:6px}
.slot use{color:#6b7a8c;--fl:#5aa9e6;animation:pop .4s}
.slot .big{color:#7a0a0a;--fl:#e02020}
@keyframes pop{from{opacity:0}}
#rv{display:flex;gap:4px;align-items:center;justify-content:center;margin:10px 0 0}
#tb{display:flex;justify-content:center;gap:18px;margin:8px 0}
.sl{display:flex;flex-direction:column;align-items:center;gap:4px}
.ph{width:min(29vw,138px);aspect-ratio:5/8.8;border:2px dashed var(--ln);border-radius:10px}
.card{width:min(29vw,138px);aspect-ratio:5/8.8;background:#fff;color:#111;border:3px solid #111;border-radius:10px;padding:5px;display:flex;flex-direction:column;text-align:center;font-size:11px}
.tag{align-self:flex-start;border:1.5px solid var(--k);color:var(--k);border-radius:5px;padding:0 5px;font-size:8px}
.card h4{margin:4px 0;font-size:11px;line-height:1.15;min-height:2.3em;border-bottom:1px solid #111;padding-bottom:3px}
.art{flex:1;min-height:0;border:1px solid #111;display:grid;place-items:center;font-size:40px;overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover}
.card small{font-size:8px;text-transform:uppercase;opacity:.65;text-align:left;margin-top:3px}
.card strong{text-align:right;font-size:13px}
.hand{display:flex;justify-content:center;gap:8px}
.hand .card{cursor:pointer;transition:transform .15s}
.hand .card:hover{transform:translateY(-6px)}
.back{background:repeating-linear-gradient(45deg,#7a1f1f 0 6px,#5c1515 6px 12px)}
.mini{width:30px;padding:0;border-width:2px;aspect-ratio:5/7}
.card em{font-size:7.5px;line-height:1.15;min-height:3.5em;max-height:4.6em;overflow:hidden;opacity:.7;margin-bottom:3px}
.win{outline:4px solid #e0a800}
.lose{opacity:.5}
#mg{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:10px;margin:8px 0}
#mg small,#nt{opacity:.7;font-size:12px}
#mg textarea,#cm textarea{width:100%;height:60px;font:12px monospace;background:var(--pn);color:var(--fg);border:1px solid var(--ln);border-radius:8px;padding:6px;margin:4px 0 8px}
a.b{display:inline-block;background:#1f8f4d;color:#fff;padding:9px 16px;border-radius:9px;text-decoration:none;margin:6px 0}
#cm{margin:10px 0}
</style></head><body>

</main>

const $=id=>document.getElementById(id),f=x=>+x.toFixed(1);
let pts,mano,H,P,hn,lead,res,ph,hist,tx;
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const card=(c,x='',a='')=>{const[t,k,l]=CN[c.c];return`<div class="card ${x}" style="--k:${k}" ${a}><b class="tag">${t}</b><h4>${c.n}</h4><em>${c.q||''}</em><div class="art">${IM[c.i]?`<img src="${IM[c.i]}" alt="">`:c.c=='W'?(c.s>101?'💉':'?'):''}</div><small>${l}</small><strong>${c.d}</strong></div>`};
const POS=['translate(15,5)','translate(65,15) rotate(90)','translate(15,57)','translate(13,15) rotate(90)','translate(10,60) rotate(-45) scale(1.5,1)'];
const slot=n=>`<svg viewBox="0 0 70 70" class="slot">${n>=5?'<use href="#sy" class="big" transform="translate(6,62) rotate(-45) scale(1.6)"/>':POS.slice(0,n).map(t=>`<use href="#sy" transform="${t}"/>`).join('')}</svg>`;
function board(){$('board').innerHTML=[['Vos',me],['Rival',1-me]].map(([n,k])=>`<div class="pl"><h3>${n}<b>${pts[k]}</b></h3>${['Malas','Buenas'].map((t,j)=>`<i>${t}</i><div class="g3">${[0,1,2].map(g=>slot(Math.max(0,Math.min(5,pts[k]-5*(3*j+g))))).join('')}</div>`).join('')}</div>`).join('')}
const L=x=>`<b>${x.n}</b> (${CN[x.c][2].toLowerCase()} ${x.d}${x.c=='W'?'':', gravedad '+f(x.s)})`;
function why(a,b,w,t){const W=[a,b][w],O=[a,b][1-w];
 if(W.s==102)return`La <b>Vacuna / Cura</b> frena a ${L(O)}: ninguna enfermedad le gana.`;
 if(W.s==101)return`<b>Enfermedad X</b> no tiene nombre ni tratamiento: le gana a ${L(O)} y a cualquier enfermedad conocida.`;
 if(t)return`Empate de gravedad (${f(W.s)}) entre ${L(W)} y ${L(O)}. Desempata quien es mano: gana <b>${W.n}</b>.`;
 return`${L(W)} le gana a ${L(O)}: es más grave (${f(W.s)} contra ${f(O.s)}).`}
function draw(){
 if(!mode){['board','rv','tb','hd','cm'].forEach(i=>$(i).innerHTML='');$('mg').innerHTML=`<b>Elegí cómo jugar</b><br><br><button onclick="solo()">Jugar contra la compu</button> <button onclick="amigo()">Jugar con un amigo</button><br><br><small>Con un amigo: se mandan las jugadas por WhatsApp, cada uno desde su teléfono. ¿Te invitaron? Pegá acá el mensaje que te llegó:</small><textarea oninput="join(this.value)"></textarea>`;return}
 const G=calc(),{p,R,n,over,lead}=G,o=1-me,r=n>seen||over,ok=can(G);pts=p;
 const k2=p+''+me;if(k2!=bk){bk=k2;board()}
 const mk=PL[me].length,ro=(mk>n?mk-1:mk)/3|0,mine=deal(ro)[me].filter(i=>!PL[me].slice(ro*3).includes(i)),oc=Math.max(0,Math.min(3,3-(PL[o].length-ro*3)));
 $('rv').innerHTML=`<i>Rival · ${oc} cartas</i>`+'<div class="card back mini"></div>'.repeat(oc);
 const cur=r?R[n-1]:null,cc=s=>cur?(s?cur.b:cur.a):(PL[s].length>n?C[PL[s][n]]:null);
 const sl=(s,t)=>`<div class="sl"><i>${t}</i>${cc(s)?card(cc(s),cur?(cur.w==s?'win':'lose'):''):'<div class="ph"></div>'}</div>`;
 $('tb').innerHTML=sl(o,'Rival')+sl(me,'Vos');
 let m;
 if(r){m=`<b>${cur.w==me?'✔ Ganás la mano':'✖ El rival gana la mano'} (+1 punto)</b><br>${why(cur.a,cur.b,cur.w,cur.t)}`;
  if(over)m+=`<br><br>🏆 <b>${p[me]>=30?'¡Ganaste la partida!':'El rival ganó la partida.'}</b>`;
  m+=`<br><br><button onclick="${over?'reset()':'cont()'}">${over?'Volver al inicio':n%3?'Siguiente mano':'Nueva ronda'}</button>`}
 else m=`<b>Mano ${n%3+1} de 3</b> · ${ok?(lead!=me&&PL[lead].length>n?'el rival ya tiró: respondé.':'tirá una carta.'):mode=='solo'?'el rival está eligiendo…':'esperando la jugada de tu amigo.'}`;
 $('mg').innerHTML=m+`<br><small>Mano de la ronda: ${(n/3|0)%2==me?'Vos':'Rival'}</small>`;
 $('hd').innerHTML=mine.map(i=>card(C[i],'',ok&&!r?`onclick="play(${i})"`:'')).join('');
 if(mode=='amigo'){const t=msg(),wa='https://wa.me/?text='+encodeURIComponent(`Mata y Vení 💉 ${t}${LINK?'\nJugá acá: '+LINK:''}`);
  $('cm').innerHTML=`<b>Tu mensaje para tu amigo</b><br><a class="b" href="${wa}" target="_blank" rel="noopener">Enviar por WhatsApp</a><br><small>Si no abre WhatsApp, copiá esto y pegalo en el chat:</small><textarea readonly onclick="this.select()">${t}</textarea><b>Jugada de tu amigo</b><br><small>Pegá acá el mensaje que te mande (con todo el texto):</small><textarea oninput="paste(this.value)"></textarea><small id="er"></small>`}
 else $('cm').innerHTML='';
 if(mode=='solo'&&!over&&!to&&PL[1].length==n&&seen==n&&(lead==1||PL[0].length>n))to=setTimeout(()=>{to=0;cpu()},800)}
const LINK=/^https?:/.test(location.protocol)?location.origin+location.pathname:'';
let S,me=0,mode=null,PL=[[],[]],seen=0,bk='',to=0;
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const deal=r=>{const R=rng(S+r*977),d=C.map((_,i)=>i);for(let i=d.length-1;i>0;i--){const j=R()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}return[d.slice(0,3),d.slice(3,6)]};
function calc(){let p=[0,0],R=[],w=0,over=0;const m=Math.min(PL[0].length,PL[1].length);
 for(let h=0;h<m&&!over;h++){const a=C[PL[0][h]],b=C[PL[1][h]],mn=(h/3|0)%2;w=a.s>b.s?0:b.s>a.s?1:mn;p[w]++;R.push({a,b,w,t:a.s==b.s});if(p[w]>=30)over=1}
 const n=R.length;return{p,R,n,over,lead:n%3?R[n-1].w:(n/3|0)%2}}
const can=G=>!G.over&&PL[me].length==G.n&&seen==G.n&&(G.lead==me||PL[G.lead].length>G.n);
const enc=l=>l.map(i=>i.toString(36).padStart(2,'0')).join('');
const dec=s=>(s.match(/../g)||[]).map(x=>parseInt(x,36)).filter(i=>i>=0&&i<54);
const msg=()=>`MV.${S.toString(36)}.${me}.${enc(PL[0])}.${enc(PL[1])}`;
const parse=t=>{const m=/MV\.([0-9a-z]+)\.([01])\.([0-9a-z]*)\.([0-9a-z]*)/i.exec(t||'');return m&&{S:parseInt(m[1],36),s:+m[2],L:[dec(m[3].toLowerCase()),dec(m[4].toLowerCase())]}};
function save(){try{localStorage.setItem('mv',JSON.stringify({mode,S,me,PL,seen}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('mv'));if(d&&d.mode)({mode,S,me,PL,seen}=d)}catch(e){}}
function begin(md){mode=md;me=0;S=Math.random()*1e9+1|0;PL=[[],[]];seen=0;save();draw()}
const solo=()=>begin('solo'),amigo=()=>begin('amigo');
function join(t){const o=parse(t);if(!o)return;mode='amigo';S=o.S;me=1-o.s;PL=o.L;seen=calc().n;save();draw()}
function paste(t){const o=parse(t);if(!o)return;if(o.S!==S){$('er').textContent='Ese mensaje es de otra partida.';return}
 let ch=0;o.L.forEach((l,s)=>{if(l.length>PL[s].length){PL[s]=l;ch=1}});if(ch){save();draw()}}
function play(i){if(!can(calc()))return;PL[me].push(i);save();draw()}
function cont(){seen=calc().n;save();draw()}
function reset(){try{localStorage.removeItem('mv')}catch(e){}mode=null;PL=[[],[]];seen=0;bk='';draw()}
function cpu(){const G=calc(),n=G.n;if(G.over||PL[1].length!=n||seen!=n||!(G.lead==1||PL[0].length>n))return;
 const ro=n/3|0,h=deal(ro)[1].filter(i=>!PL[1].slice(ro*3).includes(i)).map(i=>C[i]).sort((a,b)=>a.s-b.s),o=PL[0].length>n?C[PL[0][n]]:null;let k;
 if(o){const w=h.findIndex(x=>x.s>o.s||(x.s==o.s&&ro%2==1));k=w<0?0:w}else k=h.length>>1;
 PL[1].push(h[k].i);save();draw()}
$('rs').onclick=reset;load();draw();
</script></body></html>
